<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stubborn Clone</title>
  <style>
    :root { color-scheme: dark; --bg:#0c0f14; --ink:#e8edf5; --muted:#9aa6b8; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    .hud { max-width:920px; margin:8px auto 4px; padding:0 18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .stage { position:relative; max-width:920px; max-height:calc(100vh - 90px); margin:0 auto; background:#111; border-radius:14px; overflow:hidden; aspect-ratio:4/3; }
    #overlay { display:block; width:100%; height:100%; }
    video { position:absolute; width:640px; height:480px; left:-9999px; opacity:0; pointer-events:none; }
    button { background:var(--ink); color:#111; border:0; border-radius:8px; padding:8px 12px; font-weight:700; cursor:pointer; }
    button.ghost { background:#1b2230; color:var(--ink); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .stat { color:var(--muted); font-size:.92rem; }
    .stamp { position:absolute; left:50%; top:18%; transform:translateX(-50%); opacity:0; font-weight:800; background:var(--ok); color:#062; padding:8px 14px; border-radius:10px; pointer-events:none; }
    .stamp.on { opacity:1; }
    .err { max-width:920px; margin:8px auto; padding:0 18px; color:#ff8b8b; min-height:1.2em; }
  </style>
</head>
<body>
  <div class="hud">
    <button id="startBtn">Start</button>
    <button id="imagineBtn" class="ghost" disabled>Imagine me again</button>
    <span class="stat">Score <b id="score">0</b> · Best <b id="best">0</b> · Streak <b id="streak">0</b> · You <b id="youMove">—</b> · Pig <b id="cloneMove">—</b> · <span id="statusLine">cam off</span></span>
  </div>
  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="stamp" id="stamp">IT COPIED YOU</div>
  </div>
  <p class="err" id="err"></p>
  <script type="module">
    import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("cam");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const stamp = document.getElementById("stamp");
    const errEl = document.getElementById("err");
    const statusEl = document.getElementById("statusLine");
    const startBtn = document.getElementById("startBtn");
    const imagineBtn = document.getElementById("imagineBtn");
    const pigLooks = ["#f4a7b9", "#f7c27a", "#c9e4a8", "#a8d4f4"];
    let pigColor = pigLooks[0];
    const pigImg = new Image();
    pigImg.src = "pig.png";

    let pose = null, running = false, lastLm = null, score = 0, streak = 0;
    let best = Number(localStorage.getItem("sc-best") || 0);
    let userMove = "still", cloneMove = "still";
    let beatEnds = 0, beatLen = 1300, scoredThisBeat = false, prompt = "Get ready", startedAt = 0;
    let noseHist = [], waveFrames = 0, nodFrames = 0;
    document.getElementById("best").textContent = best;

    function wSafe() { return canvas.clientWidth || 640; }
    function hSafe() { return canvas.clientHeight || 480; }

    async function waitForFrames(el, timeoutMs = 8000) {
      const t0 = performance.now();
      el.muted = true;
      el.playsInline = true;
      if (el.readyState < 1) {
        await new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error("no frames")), timeoutMs);
          el.onloadedmetadata = () => { clearTimeout(t); resolve(); };
        });
      }
      try { await el.play(); } catch (_) {}
      while (!el.videoWidth) {
        if (performance.now() - t0 > timeoutMs) throw new Error("no frames");
        await new Promise((r) => requestAnimationFrame(r));
      }
    }

    function detectMove(lm) {
      const nose = lm[0], ls = lm[11], rs = lm[12], lw = lm[15], rw = lm[16];
      if (!nose || !ls || !rs) return "still";
      const shoulderY = (ls.y + rs.y) / 2;
      const vis = (p) => !p || p.visibility === undefined || p.visibility > 0.5;
      const up = (lw && vis(lw) && lw.y < shoulderY - 0.12) || (rw && vis(rw) && rw.y < shoulderY - 0.12);
      waveFrames = up ? waveFrames + 1 : 0;
      noseHist.push(nose.y);
      if (noseHist.length > 18) noseHist.shift();
      const span = noseHist.length >= 12 ? Math.max(...noseHist) - Math.min(...noseHist) : 0;
      nodFrames = span > 0.045 ? nodFrames + 1 : Math.max(0, nodFrames - 1);
      if (waveFrames >= 6) return "wave";
      if (nodFrames >= 8) return "nod";
      return "still";
    }

    function nextBeat(now) {
      cloneMove = Math.random() < 0.5 ? "wave" : "nod";
      beatLen = 1100 + Math.random() * 400;
      beatEnds = now + beatLen;
      scoredThisBeat = false;
      prompt = cloneMove === "wave" ? "PIG WAVES — YOU NOD" : "PIG NODS — YOU WAVE";
    }

    function paintBg(w, h, now) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      const t = (Math.sin(now / 1800) + 1) / 2;
      g.addColorStop(0, t > 0.5 ? "#1b3358" : "#3a1d4a");
      g.addColorStop(1, t > 0.5 ? "#0b1020" : "#1a0f18");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 28; i++) {
        const px = (i * 97 + now / (18 + i)) % (w + 40) - 20;
        const py = (i * 53 + Math.sin(now / 700 + i) * 18) % h;
        ctx.fillStyle = "rgba(255,255,255," + (0.15 + (i % 5) * 0.08) + ")";
        ctx.beginPath();
        ctx.arc(px, py, 2 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function paintPig(drawCtx, x, y, move, now) {
      const bob = move === "nod" ? Math.sin(now / 140) * 10 : Math.sin(now / 320) * 3;
      const tilt = move === "wave" ? Math.sin(now / 140) * 0.18 : (move === "nod" ? Math.sin(now / 160) * 0.12 : 0);
      if (pigImg.complete && pigImg.naturalWidth) {
        const size = Math.round(Math.min(wSafe(), hSafe()) * 0.30);
        drawCtx.save();
        drawCtx.translate(x, y + bob);
        drawCtx.rotate(tilt);
        drawCtx.drawImage(pigImg, -size / 2, -size / 2, size, size);
        drawCtx.restore();
        return;
      }
      const wave = move === "wave" ? 0.45 + Math.sin(now / 140) * 0.5 : 0.08;
      drawCtx.save();
      drawCtx.translate(x, y + bob);
      drawCtx.fillStyle = pigColor;
      drawCtx.beginPath(); drawCtx.ellipse(0, 18, 42, 50, 0, 0, Math.PI * 2); drawCtx.fill();
      drawCtx.beginPath(); drawCtx.arc(0, -8, 36, 0, Math.PI * 2); drawCtx.fill();
      drawCtx.fillStyle = "#2b2430";
      drawCtx.beginPath(); drawCtx.arc(-14, -14, 4.5, 0, Math.PI * 2); drawCtx.arc(14, -14, 4.5, 0, Math.PI * 2); drawCtx.fill();
      drawCtx.strokeStyle = pigColor;
      drawCtx.lineWidth = 14;
      drawCtx.lineCap = "round";
      drawCtx.beginPath();
      drawCtx.moveTo(-34, 28);
      drawCtx.lineTo(-58, 20 - wave * 50);
      drawCtx.moveTo(34, 28);
      drawCtx.lineTo(56, 36);
      drawCtx.stroke();
      drawCtx.restore();
    }

    function paint() {
      const w = wSafe(), h = hSafe(), now = performance.now();
      canvas.width = w; canvas.height = h;
      paintBg(w, h, now);

      if (video.videoWidth) {
        const rw = Math.round(w * 0.34), rh = Math.round(rw * 0.75);
        const cx = w * 0.30, cy = h * 0.52;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, Math.min(rw, rh) / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.translate(cx + rw / 2, cy - rh / 2);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, rw, rh);
        ctx.restore();
      }

      paintPig(ctx, w * 0.70, h * 0.52, cloneMove, now);

      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(16, 16, w - 32, 48);
      ctx.fillStyle = "#e8edf5";
      ctx.font = "700 22px ui-sans-serif, system-ui";
      ctx.fillText(now - startedAt < 3000 ? "WAVE = hand up   NOD = bob head" : prompt, 28, 48);
      const left = beatEnds > now ? (beatEnds - now) / beatLen : 0;
      ctx.fillStyle = scoredThisBeat ? "#3dd68c" : "#ffb020";
      ctx.fillRect(16, 64, Math.max(0, (w - 32) * left), 7);
    }

    function tick() {
      if (!running) return;
      const now = performance.now();
      statusEl.textContent = video.videoWidth ? video.videoWidth + "x" + video.videoHeight : "no frames";
      if (pose && video.videoWidth) {
        try {
          const res = pose.detectForVideo(video, now);
          const lm = res.landmarks && res.landmarks[0];
          if (lm) lastLm = lm;
          userMove = lm ? detectMove(lm) : "still";
        } catch (_) {}
      }
      if (now - startedAt > 3000) {
        if (!beatEnds) nextBeat(now);
        if (now > beatEnds) {
          if (!scoredThisBeat) streak = 0;
          nextBeat(now);
        }
        const need = cloneMove === "wave" ? "nod" : "wave";
        if (!scoredThisBeat && userMove === need) {
          scoredThisBeat = true;
          streak += 1;
          score += streak >= 3 ? 2 : 1;
          if (score > best) { best = score; localStorage.setItem("sc-best", String(best)); }
          document.getElementById("score").textContent = score;
          document.getElementById("best").textContent = best;
          stamp.textContent = streak >= 3 ? "IT COPIED YOU" : "NICE MATCH";
          stamp.classList.add("on");
          setTimeout(() => stamp.classList.remove("on"), 450);
        }
        document.getElementById("streak").textContent = streak;
      }
      document.getElementById("youMove").textContent = userMove;
      document.getElementById("cloneMove").textContent = cloneMove;
      paint();
      requestAnimationFrame(tick);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      errEl.textContent = "Starting camera…";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await waitForFrames(video);
        running = true;
        startedAt = performance.now();
        imagineBtn.disabled = false;
        errEl.textContent = "";
        tick();
        try {
          const files = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          );
          pose = await PoseLandmarker.createFromOptions(files, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
            },
            runningMode: "VIDEO",
            numPoses: 1
          });
        } catch (modelErr) {
          console.error(modelErr);
          errEl.textContent = "Camera is on. Pose model failed: " + (modelErr.message || modelErr);
        }
      } catch (e) {
        console.error(e);
        errEl.textContent = "Camera blocked or sent no picture. Allow camera for this site, close Zoom/Meet, reload.";
        startBtn.disabled = false;
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((t) => t.stop());
          video.srcObject = null;
        }
      }
    });

    imagineBtn.addEventListener("click", () => {
      pigColor = pigLooks[(pigLooks.indexOf(pigColor) + 1) % pigLooks.length];
      errEl.textContent = "New pig color";
    });
  </script>
</body>
</html>
